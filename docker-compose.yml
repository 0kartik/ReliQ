version: "3.9"
services:
  redis:
    image: redis:7-alpine
    container_name: reliablequeue-redis
    ports:
      - "6379:6379"
      - "6380:6380"
    volumes:
      - redis_data:/data
      - ./redis-tls:/tls:ro
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-devpassword123}
      --appendonly yes
      --appendfsync everysec
      --port 6379
      --tls-port 6380
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients optional
volumes:
  redis_data: