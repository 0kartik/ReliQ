version: "3.9"
services:
  redis:
    image: redis:7-alpine
    container_name: reliablequeue-redis
    ports:
      - "6379:6379"
      - "6380:6380"
    volumes:
      - redis_data:/data
      - ./redis-tls:/tls:ro
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-devpassword123}
      --appendonly yes
      --appendfsync everysec
      --port 6379
      --tls-port 6380
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients optional

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: reliablequeue-gateway
    command: ["node", "src/gateway/server.js"]
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports:
      - "3000:3000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: reliablequeue-worker
    command: ["node", "src/worker/worker.js"]
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: reliablequeue-scheduler
    command: ["node", "src/retry/scheduler.js"]
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  reaper:
    build:
      context: .
      dockerfile: Dockerfile.reaper
    container_name: reliablequeue-reaper
    command: ["node", "src/reaper/reaper.js"]
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

volumes:
  redis_data:
